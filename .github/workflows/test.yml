name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # The recorder runs on Node, not Bun. Node 22 is the oldest version it supports.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Importing the driver does not start a recording
        run: node --input-type=module -e "await import('./skills/record-user-journey/driver.mjs')"
      - name: Running the driver without a journey prints its usage
        run: |
          status=0
          node skills/record-user-journey/driver.mjs || status=$?
          test "$status" -eq 2
